# Example static inventory in INI format (documentation only).
# The test inventory is generated by `tofu apply` at ../build/hosts.ini.
# For a bare-metal cluster, paste one node IP per line under each group.
# SLURM node names become the IPs, and private_ip defaults to the host IP
# (see group_vars/all.yml).

[slurmservers]
10.0.0.1

[slurmexechosts]
10.0.0.2
10.0.0.3
# ... paste up to 128+ IPs, one per line, or use a range:
# 10.0.0.[2:129]

[slurmdbdservers]
10.0.0.1

[all:vars]
ansible_user=root
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
