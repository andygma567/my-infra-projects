# Example static inventory in INI format -- DOCUMENTATION ONLY.
# This file is intentionally NOT inside ansible/inventory/ so Ansible does not
# load it as a live inventory source. The real inventory is
# ansible/inventory/hosts.ini (generated by `tofu apply` at build/hosts.ini).
#
# For a bare-metal cluster, paste one node IP per line under each group.
# Shared connection vars (ansible_user, ssh args, etc.) live in
# ansible/inventory/group_vars/all.yml, so the inventory stays a clean list of IPs.

[slurmservers]
10.0.0.1

[slurmexechosts]
10.0.0.2
10.0.0.3
# ... paste up to 128+ IPs, one per line, or use a range:
# 10.0.0.[2:129]

[slurmdbdservers]
10.0.0.1
